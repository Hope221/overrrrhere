<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retro game details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0C}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 852px; height: 393px; overflow: hidden; background: #0A0A0C; font-family: 'Figtree', system-ui, sans-serif; color: #FFFFFF;">

<img src="/_blob/b6710dba22a40bd1307ca4aaac39dffb" alt="" style="position: absolute; left: 0; top: 0; width: 852px; height: 393px; object-fit: cover; object-position: 60% 50%; image-rendering: pixelated;">
<div style="position: absolute; left: 0; top: 0; width: 852px; height: 393px; background: linear-gradient(90deg, rgba(8,8,10,0.95) 0%, rgba(8,8,10,0.85) 48%, rgba(8,8,10,0.25) 78%, rgba(8,8,10,0.1) 100%);"></div>
<div style="position: absolute; left: 0; top: 0; width: 852px; height: 393px; background: linear-gradient(0deg, rgba(8,8,10,0.75) 0%, rgba(8,8,10,0) 42%);"></div>

<div style="position: absolute; left: 0; top: 0; width: 852px; height: 393px; box-sizing: border-box; padding: 22px 56px 20px 56px; display: flex; flex-direction: column;">

<div style="flex-grow: 1;"></div>

<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.01em;">[Game title]</h1>
<div style="margin-top: 2px; font-size: 13px; line-height: 18px; color: rgba(255,255,255,0.74);">Super Nintendo · On this iPhone · 4 MB</div>

<div style="margin-top: 14px; display: flex; flex-direction: row; gap: 28px;">
<div style="display: flex; flex-direction: column;">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.6);">Last played</span>
<span style="margin-top: 3px; font-size: 15px; line-height: 20px; font-weight: 700;">Yesterday</span>
</div>
<div style="display: flex; flex-direction: column;">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.6);">Played here</span>
<span style="margin-top: 3px; font-size: 15px; line-height: 20px; font-weight: 700;">3 h</span>
</div>
</div>

<div style="margin-top: 16px; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.6);">Save states</div>
<div style="margin-top: 8px; display: flex; flex-direction: row; gap: 14px;">
<sc-for list="{{saves}}" as="s" hint-placeholder-count="3">
<button type="button" onClick="{{s.pick}}" aria-label="{{s.name}}" style="display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: transparent; color: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; text-align: left; cursor: pointer;">
<span style="display: block; width: 96px; height: 72px; border-radius: 8px; overflow: hidden; box-shadow: {{s.ring}};">
<img src="/_blob/b6710dba22a40bd1307ca4aaac39dffb" alt="" style="width: 96px; height: 72px; object-fit: cover; object-position: {{s.pos}}; image-rendering: pixelated;">
</span>
<span style="display: flex; flex-direction: column;">
<span style="font-size: 12px; line-height: 16px; font-weight: 700;">{{s.name}}</span>
<span style="font-size: 11px; line-height: 14px; color: rgba(255,255,255,0.6);">{{s.when}}</span>
</span>
</button>
</sc-for>
</div>

<div style="margin-top: 16px; display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
<div style="display: flex; flex-direction: row; align-items: center; gap: 10px;">
<a href="RetroPlay.dc.html" style="height: 44px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 0 22px 0 10px; border-radius: 999px; background: #FFFFFF; color: #0A0A0C; text-decoration: none; font-size: 15px; font-weight: 700;">
<span style="width: 26px; height: 26px; border-radius: 999px; background: #0A0A0C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">A</span>
<span>{{playLabel}}</span>
</a>
<button type="button" onClick="{{togglePin}}" style="height: 44px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 0 20px 0 10px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.28); color: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">
<span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">Y</span>
<span>{{pinLabel}}</span>
</button>
<a href="TileEditor.dc.html" style="height: 44px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 0 20px 0 10px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.28); color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600;">
<span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">X</span>
<span>Edit tile</span>
</a>
<button type="button" onClick="{{askDelete}}" style="height: 44px; padding: 0 20px; border: 1.5px solid rgba(255,138,115,0.55); border-radius: 999px; background: transparent; color: #FF8A73; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">Delete</button>
</div>
<a href="RetroLibrary.dc.html" style="display: flex; flex-direction: row; align-items: center; gap: 7px; height: 44px; font-size: 12px; color: rgba(255,255,255,0.74); text-decoration: none;">
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #FFFFFF;">B</span>
<span>Back</span>
</a>
</div>

</div>

<sc-if value="{{confirmDelete}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 852px; height: 393px; background: rgba(8,8,10,0.62); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;">
<div role="alertdialog" aria-label="Delete this game" style="width: 420px; box-sizing: border-box; padding: 22px 24px 18px 24px; border-radius: 18px; background: rgba(24,24,28,0.96); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 24px 60px rgba(0,0,0,0.55); display: flex; flex-direction: column;">
<div style="font-size: 20px; line-height: 26px; font-weight: 800;">Delete this game?</div>
<p style="margin: 8px 0 0 0; font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.76);">The ROM file and its save states will be removed from this iPhone.</p>
<div style="margin-top: 20px; display: flex; flex-direction: row; gap: 12px;">
<button type="button" onClick="{{cancelDelete}}" style="height: 44px; padding: 0 26px; border: 0; border-radius: 999px; background: #FFFFFF; color: #0A0A0C; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 0 0 2px #18181C, 0 0 0 4px #FFFFFF;">Cancel</button>
<button type="button" onClick="{{cancelDelete}}" style="height: 44px; padding: 0 22px; border: 1.5px solid rgba(255,138,115,0.6); border-radius: 999px; background: transparent; color: #FF8A73; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">Delete</button>
</div>
<div style="margin-top: 16px; display: flex; flex-direction: row; gap: 18px; font-size: 12px; color: rgba(255,255,255,0.7);">
<div style="display: flex; flex-direction: row; align-items: center; gap: 7px;">
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #FFFFFF;">A</span>
<span>Select</span>
</div>
<div style="display: flex; flex-direction: row; align-items: center; gap: 7px;">
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #FFFFFF;">B</span>
<span>Cancel</span>
</div>
</div>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":852,"height":393}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { save: 'auto', pinned: true, confirmDelete: false };
  }
  renderVals() {
    const list = [
      { id: 'auto', name: 'Auto-save', when: '2 h ago', pos: '30% 50%' },
      { id: 's1', name: 'Slot 1', when: 'Yesterday', pos: '60% 50%' },
      { id: 's2', name: 'Slot 2', when: 'Sep 20', pos: '90% 50%' }
    ];
    const saves = list.map((s) => {
      const on = s.id === this.state.save;
      return {
        name: s.name, when: s.when, pos: s.pos,
        ring: on ? '0 0 0 2px #0A0A0C, 0 0 0 4px #FFFFFF' : '0 4px 12px rgba(0,0,0,0.4)',
        pick: () => this.setState({ save: s.id })
      };
    });
    const curSave = list.find((s) => s.id === this.state.save) || list[0];
    return {
      saves: saves,
      playLabel: curSave.id === 'auto' ? 'Continue' : 'Load ' + curSave.name,
      pinLabel: this.state.pinned ? 'Unpin from home' : 'Pin to home',
      togglePin: () => this.setState({ pinned: !this.state.pinned }),
      confirmDelete: this.state.confirmDelete,
      askDelete: () => this.setState({ confirmDelete: true }),
      cancelDelete: () => this.setState({ confirmDelete: false })
    };
  }
}
</script>
</body>
</html>
