<nav aria-label="Wii options" style="position: absolute; left: 0; top: 0; width: 340px; height: 393px; box-sizing: border-box; padding: 18px 20px 18px 56px; display: flex; flex-direction: column; background: rgba(22,22,26,0.86); backdrop-filter: blur(24px); border-right: 1px solid rgba(255,255,255,0.08); border-radius: 0 22px 22px 0;">

<span>Pointer</span>
<span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75);">{{pointer}}</span>
</button>
<div style="height: 42px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 12px; border-radius: 10px; color: rgba(255,255,255,0.85); font-size: 15px; font-weight: 500;">
<span>Pointer speed</span>
<div style="display: flex; flex-direction: row; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(255,255,255,0.1);">
<sc-for list="{{speeds}}" as="v" hint-placeholder-count="3">

<span>Change</span>

<span>Back</span>
</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":852,"height":393}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { controller: 'Remote + Nunchuk', pointer: 'Right stick', speed: 'Medium', auto: true };
  }
  renderVals() {
    const controllers = ['Remote + Nunchuk', 'Sideways Remote', 'Classic Controller', 'GameCube Controller'];
    const pointers = ['Right stick', 'Gyro + right stick', 'Touch'];
    const hints = {
      'Right stick': 'Push the right stick to move the pointer. Push further to go faster.',
      'Gyro + right stick': 'Tilt your iPhone to aim, like a real Wii Remote. The right stick fine-tunes.',
      'Touch': 'Touch the screen where you want to point. Press A to select.'
    };
    const st = this.state;
    const speeds = ['Slow', 'Medium', 'Fast'].map((v) => {
      const on = st.speed === v;
      return {
        label: v, on: on ? 'true' : 'false',
        bg: on ? '#FFFFFF' : 'transparent',
        fg: on ? '#0A0A0C' : 'rgba(255,255,255,0.74)',
        pick: () => this.setState({ speed: v })
      };
    });
    const noPointer = st.controller === 'Classic Controller' || st.controller === 'GameCube Controller';
    return {
      controller: st.auto ? st.controller + ' · Auto' : st.controller,
      pointer: noPointer ? 'Not used' : st.pointer,
      pointerHint: st.controller === 'GameCube Controller'
        ? 'Plays like a GameCube controller: no pointer, no motion. Best for games that support it.'
        : (st.controller === 'Classic Controller' ? 'The Classic Controller has no pointer. Use it for games that support it.' : hints[st.pointer]),
      speeds: speeds,
      cycleController: () => this.setState({ controller: controllers[(controllers.indexOf(st.controller) + 1) % controllers.length], auto: false }),
      cyclePointer: () => this.setState({ pointer: pointers[(pointers.indexOf(st.pointer) + 1) % 3] })
    };
  }
}
</script>
