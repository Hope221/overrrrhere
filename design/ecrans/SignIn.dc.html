<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect your Xbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0C}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
@keyframes lp-dash{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
</style>
</helmet>
<div style="position: relative; width: 852px; height: 393px; overflow: hidden; background: #0A0A0C; font-family: 'Figtree', system-ui, sans-serif; color: #FFFFFF;">

<div style="position: absolute; left: 0; top: 0; width: 852px; height: 393px; filter: blur(24px) brightness(0.32); pointer-events: none; transform: scale(1.08);" aria-hidden="true">
<dc-import name="Main" hint-size="852px,393px"></dc-import>
</div>

<div style="position: absolute; left: 0; top: 0; width: 852px; height: 393px; box-sizing: border-box; padding: 18px 56px 24px 56px; display: flex; flex-direction: row; align-items: center; justify-content: space-between;">

<div style="width: 380px; display: flex; flex-direction: column;">
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.015em;">Connect your Xbox</h1>
<p style="margin: 10px 0 0 0; font-size: 14px; line-height: 21px; color: rgba(255,255,255,0.78);">Your installed games show up here. Press A to play.</p>
<sc-if value="{{online}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column;">
<div style="margin-top: 24px; display: flex; flex-direction: row; align-items: center; gap: 10px;">
<a href="Consoles.dc.html" style="height: 44px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 0 22px 0 10px; border-radius: 999px; background: #FFFFFF; color: #0A0A0C; text-decoration: none; font-size: 15px; font-weight: 700;">
<span style="width: 26px; height: 26px; border-radius: 999px; background: #0A0A0C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">A</span>
<span>Sign in with Microsoft</span>
</a>
<a href="Main.dc.html" style="height: 44px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-radius: 999px; color: rgba(255,255,255,0.78); text-decoration: none; font-size: 14px; font-weight: 600;">Continue without Xbox</a>
</div>
<div style="margin-top: 16px; display: flex; flex-direction: row; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.66);">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span>Your sign-in stays on this iPhone.</span>
</div>
<div style="margin-top: 8px; display: flex; flex-direction: row; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.66);">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v5"></path><path d="M13 10a2 2 0 0 1 4 0v1a2 2 0 0 1 3 1.7V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.9-2.5L5 15.5a1.8 1.8 0 0 1 2.8-2.2L9 14.5"></path></svg>
<span>Microsoft's page opens next: use touch for this one step.</span>
</div>
</div>
</sc-if>

<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column;">
<div style="margin-top: 20px; box-sizing: border-box; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: row; gap: 12px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M2.5 8.5a14 14 0 0 1 19 0"></path><path d="M5.5 12a9.5 9.5 0 0 1 13 0"></path><path d="M8.7 15.4a5 5 0 0 1 6.6 0"></path><path d="M12 19h.01"></path><path d="M3 3l18 18"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 14px; line-height: 19px; font-weight: 700;">You're offline</span>
<span style="font-size: 13px; line-height: 18px; color: rgba(255,255,255,0.74);">Retro games still work.</span>
</div>
</div>
<div style="margin-top: 18px; display: flex; flex-direction: row; align-items: center; gap: 10px;">
<a href="Main.dc.html" style="height: 44px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 0 22px 0 10px; border-radius: 999px; background: #FFFFFF; color: #0A0A0C; text-decoration: none; font-size: 15px; font-weight: 700;">
<span style="width: 26px; height: 26px; border-radius: 999px; background: #0A0A0C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">A</span>
<span>Continue without Xbox</span>
</a>
<button type="button" onClick="{{retry}}" style="height: 44px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 0 20px 0 10px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.3); background: transparent; color: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">
<span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">X</span>
<span>Try again</span>
</button>
</div>
</div>
</sc-if>
</div>

<svg width="300" height="160" viewBox="0 0 300 160" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect x="10" y="20" width="62" height="120" rx="10"></rect>
<path d="M22 124h38" opacity="0.4"></path>
<circle cx="41" cy="40" r="4" opacity="0.6"></circle>
<rect x="196" y="52" width="94" height="56" rx="10" transform="rotate(90 243 80)"></rect>
<rect x="206" y="62" width="74" height="36" rx="5" opacity="0.25" transform="rotate(90 243 80)"></rect>
<path d="M84 80 H186" stroke="#7CE3A6" stroke-dasharray="4 8" style="animation: lp-dash 1.2s linear infinite;"></path>
<circle cx="135" cy="80" r="15" stroke="#7CE3A6"></circle>
<path d="M129 80l4 4 8-8" stroke="#7CE3A6"></path>
</svg>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"offline":{"editor":"boolean","default":false},"$preview":{"width":852,"height":393}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { retried: false };
  }
  renderVals() {
    const off = (this.props.offline ?? false) && !this.state.retried;
    return {
      online: !off,
      offline: off,
      retry: () => this.setState({ retried: true })
    };
  }
}
</script>
</body>
</html>
