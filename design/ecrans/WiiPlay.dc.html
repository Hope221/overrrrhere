<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wii — pointer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
@keyframes wii-ring{0%{transform:scale(0.4);opacity:0.9}100%{transform:scale(2.2);opacity:0}}
</style>
</helmet>
<div style="position: relative; width: 852px; height: 393px; overflow: hidden; background: #000000; font-family: 'Figtree', system-ui, sans-serif; color: #FFFFFF;">

<img src="/_blob/4451805e6e8ca1d9dd1b2285cc560b82" alt="Game screen (placeholder)" style="position: absolute; left: 77px; top: 0; width: 699px; height: 393px; image-rendering: pixelated;">

<sc-if value="{{showCursor}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: {{cx}}px; top: {{cy}}px; width: 0; height: 0;">
<sc-if value="{{ring}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 999px; border: 2px solid #FFFFFF; animation: wii-ring 1.2s ease-out infinite;"></span>
</sc-if>
<svg width="26" height="32" viewBox="0 0 26 32" aria-label="Game cursor" role="img" style="position: absolute; left: -3px; top: -2px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));">
<path d="M3 2 L3 26 L9.5 20 L14 30 L18 28 L13.5 18.5 L22 18.5 Z" fill="#FFFFFF" stroke="#0A0A0C" stroke-width="1.8" stroke-linejoin="round"></path>
</svg>
</div>
</sc-if>

<sc-if value="{{modeToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); height: 44px; box-sizing: border-box; padding: 0 16px 0 8px; border-radius: 999px; background: rgba(22,22,26,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 10px 28px rgba(0,0,0,0.45); display: flex; flex-direction: row; align-items: center; gap: 10px; white-space: nowrap;">
<span style="width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3.5" fill="#FFFFFF"></circle></svg>
</span>
<span style="display: flex; flex-direction: column;">
<span style="font-size: 13px; line-height: 17px; font-weight: 700;">Pointer · Right stick</span>
<span style="font-size: 11px; line-height: 14px; color: rgba(255,255,255,0.65);">Click the right stick to recenter</span>
</span>
</div>
</sc-if>

<sc-if value="{{offScreen}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; right: 64px; top: 172px; height: 40px; box-sizing: border-box; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(22,22,26,0.88); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 10px 28px rgba(0,0,0,0.45); display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap;">
<span style="display: flex; flex-direction: column; align-items: flex-end;">
<span style="font-size: 12px; line-height: 16px; font-weight: 700;">Pointer off screen</span>
<span style="font-size: 11px; line-height: 14px; color: rgba(255,255,255,0.65);">Click the right stick to bring it back</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</div>
<div style="position: absolute; left: 772px; top: 150px; width: 4px; height: 92px; border-radius: 4px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 100%);"></div>
</sc-if>

<sc-if value="{{controlsChosen}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); height: 44px; box-sizing: border-box; padding: 0 16px 0 8px; border-radius: 999px; background: rgba(22,22,26,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 10px 28px rgba(0,0,0,0.45); display: flex; flex-direction: row; align-items: center; gap: 10px; white-space: nowrap;">
<span style="width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="3"></rect><path d="M7 12h2M8 11v2M15 12h.01M17 12h.01"></path></svg>
</span>
<span style="display: flex; flex-direction: column;">
<span style="font-size: 13px; line-height: 17px; font-weight: 700;">Controls: Sideways Remote</span>
<span style="font-size: 11px; line-height: 14px; color: rgba(255,255,255,0.65);">Chosen for this game · Change it in the menu</span>
</span>
</div>
</sc-if>

<sc-if value="{{firstLaunch}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); height: 40px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 999px; background: rgba(22,22,26,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: row; align-items: center; gap: 10px; white-space: nowrap;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="font-size: 12px; line-height: 16px; font-weight: 600;">May stutter at first, then gets smoother.</span>
</div>
</sc-if>

<sc-if value="{{recentered}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; background: rgba(22,22,26,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; font-size: 12px; font-weight: 700; white-space: nowrap;">Pointer recentered</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["Playing","First launch","Controls chosen","Pointer mode shown","Pointer off screen","Recentered"],"default":"Pointer mode shown"},"$preview":{"width":852,"height":393}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'Pointer mode shown';
    const center = s === 'Recentered';
    return {
      showCursor: s !== 'Pointer off screen',
      cx: center ? 426 : 520,
      cy: center ? 196 : 190,
      ring: center,
      modeToast: s === 'Pointer mode shown',
      offScreen: s === 'Pointer off screen',
      controlsChosen: s === 'Controls chosen',
      firstLaunch: s === 'First launch',
      recentered: center
    };
  }
}
</script>
</body>
</html>
