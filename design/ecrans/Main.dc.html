<script type="text/x-dc" data-dc-script data-props='{"focusColor":{"editor":"color","default":"#FFFFFF","options":["#FFFFFF","#7CE3A6","#8AB4FF"]},"firstRun":{"editor":"boolean","default":false},"offline":{"editor":"boolean","default":false},"$preview":{"width":852,"height":393}}'>
class Component extends DCLogic {
  constructor(props) {

    this.state = { sel: 'requiem' };
  }
  renderVals() {
    const focus = this.props.focusColor ?? '#FFFFFF';
    const base = { sunX: 610, sunY: 200, sunO: 1, glowO: 0.18, stars: 0, signal: 0, hills: 1, castle: 0, cypress: 0, hasArt: true, isAdd: false, photo: false, photo2: false, href: 'Launch.dc.html' };

      Object.assign({}, base, {
        id: 'requiem', title: 'A Plague Tale: Requiem', meta: 'Last played yesterday · 14 h played', action: 'Play', photo: true,

      Object.assign({}, base, {

        skyTop: '#050E09', skyBot: '#0E2B1C', sun: '#8FE8B4', sunX: 640, sunY: 190, sunR: 6, glowR: 30, glowO: 0.25,

    return {
      tiles: tiles, cur: cur, rowShift: rowShift, firstRun: this.props.firstRun ?? false,
      chipDot: offline ? 'rgba(255,255,255,0.45)' : '#7CE3A6',
      chipLabel: offline ? 'Offline' : 'Xbox Series X'
    };
  }
}
</script>
</body>
