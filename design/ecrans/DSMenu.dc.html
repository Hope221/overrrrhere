<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DS — game menu</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 852px; height: 393px; overflow: hidden; background: #050507; font-family: 'Figtree', system-ui, sans-serif; color: #FFFFFF;">

<img src="./assets/cae3aac66ab7436737564c863315a630.png" alt="" style="position: absolute; left: 56px; top: 60px; width: 364px; height: 273px; border-radius: 6px; image-rendering: pixelated;">
<img src="./assets/b133cf4b20706365c961cb8c476e4d22.png" alt="" style="position: absolute; left: 432px; top: 60px; width: 364px; height: 273px; border-radius: 6px; image-rendering: pixelated;">
<div style="position: absolute; left: 0; top: 0; width: 852px; height: 393px; background: rgba(8,8,10,0.5);"></div>

<nav aria-label="Game menu" style="position: absolute; left: 0; top: 0; width: 320px; height: 393px; box-sizing: border-box; padding: 18px 20px 18px 56px; display: flex; flex-direction: column; background: rgba(22,22,26,0.86); backdrop-filter: blur(24px); border-right: 1px solid rgba(255,255,255,0.08); border-radius: 0 22px 22px 0;">

<sc-if value="{{isMain}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; flex-grow: 1;">
<div style="padding: 0 12px;">
<div style="font-size: 17px; line-height: 22px; font-weight: 700;">[Game title]</div>
<div style="font-size: 12px; line-height: 17px; color: rgba(255,255,255,0.7);">DS · 24 min · Battery 68%</div>
</div>
<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 2px;">
<sc-for list="{{mainRows}}" as="r" hint-placeholder-count="7">
<button type="button" onClick="{{r.pick}}" style="height: 38px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 12px; border: 0; border-radius: 10px; background: {{r.bg}}; color: {{r.fg}}; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: {{r.weight}}; text-align: left; cursor: pointer;">
<span>{{r.label}}</span>
<span style="font-size: 13px; color: rgba(255,255,255,0.55);">{{r.value}}</span>
</button>
</sc-for>
</div>
<div style="flex-grow: 1;"></div>
<div style="padding: 0 12px; font-size: 12px; line-height: 17px; color: rgba(255,255,255,0.6);">Game paused</div>
</div>
</sc-if>

<sc-if value="{{isDs}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; flex-grow: 1;">
<div style="padding: 0 12px;">
<div style="font-size: 17px; line-height: 22px; font-weight: 700;">DS options</div>
<div style="font-size: 12px; line-height: 17px; color: rgba(255,255,255,0.7);">Screens and special controls</div>
</div>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 2px;">
<button type="button" onClick="{{cycleLayout}}" style="height: 44px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 12px; border: 0; border-radius: 10px; background: rgba(255,255,255,0.12); color: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer;">
<span>Screen layout</span>
<span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7);">{{layout}}</span>
</button>
<button type="button" style="height: 44px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: rgba(255,255,255,0.8); font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer;">
<span>Swap screens</span>
<span style="font-size: 12px; color: rgba(255,255,255,0.5);">Right stick click</span>
</button>
<button type="button" style="height: 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: rgba(255,255,255,0.8); font-family: 'Figtree', system-ui, sans-serif; text-align: left; cursor: pointer;">
<span style="font-size: 15px; font-weight: 500;">Blow into the microphone</span>
<span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.5);">For games that ask you to blow. Hold A here.</span>
</button>
<button type="button" onClick="{{toggleLid}}" style="height: 44px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: rgba(255,255,255,0.8); font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer;">
<span>Close the lid</span>
<span style="position: relative; width: 40px; height: 24px; border-radius: 999px; background: {{lidTrack}};">
<span style="position: absolute; top: 3px; left: {{lidKnobX}}px; width: 18px; height: 18px; border-radius: 999px; background: {{lidKnob}}; transition: left 160ms ease;"></span>
</span>
</button>
</div>
<div style="flex-grow: 1;"></div>
<div style="display: flex; flex-direction: row; gap: 18px; padding: 0 12px; font-size: 12px; color: rgba(255,255,255,0.7);">
<div style="display: flex; flex-direction: row; align-items: center; gap: 7px;">
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #FFFFFF;">A</span>
<span>Select</span>
</div>
<button type="button" onClick="{{backToMain}}" style="display: flex; flex-direction: row; align-items: center; gap: 7px; padding: 0; border: 0; background: transparent; color: rgba(255,255,255,0.7); font-family: 'Figtree', system-ui, sans-serif; font-size: 12px; cursor: pointer;">
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #FFFFFF;">B</span>
<span>Back</span>
</button>
</div>
</div>
</sc-if>

</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":852,"height":393}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'ds', layout: 'Side by side', lid: false };
  }
  renderVals() {
    const layouts = ['Side by side', 'Stacked', 'Focus'];
    const L = this.state.layout;
    const lid = this.state.lid;
    const rows = [
      { label: 'Resume', value: '', on: true },
      { label: 'Save state', value: 'Slot 2' },
      { label: 'Load state', value: '1 save' },
      { label: 'DS options', value: '›', open: true },
      { label: 'Fast forward', value: 'Off' },
      { label: 'Touch controls', value: 'Auto' },
      { label: 'Back to launcher', value: '' }
    ];
    const mainRows = rows.map((r) => ({
      label: r.label, value: r.value,
      bg: r.on ? 'rgba(255,255,255,0.12)' : 'transparent',
      fg: r.on ? '#FFFFFF' : 'rgba(255,255,255,0.72)',
      weight: r.on ? 600 : 500,
      pick: () => { if (r.open) this.setState({ view: 'ds' }); }
    }));
    return {
      isMain: this.state.view === 'main',
      isDs: this.state.view === 'ds',
      mainRows: mainRows,
      layout: L,
      cycleLayout: () => this.setState({ layout: layouts[(layouts.indexOf(L) + 1) % 3] }),
      lidTrack: lid ? '#FFFFFF' : 'rgba(255,255,255,0.22)',
      lidKnob: lid ? '#0A0A0C' : '#FFFFFF',
      lidKnobX: lid ? 19 : 3,
      toggleLid: () => this.setState({ lid: !lid }),
      backToMain: () => this.setState({ view: 'main' })
    };
  }
}
</script>
</body>
</html>
